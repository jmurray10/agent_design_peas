# Tier-to-model mapping.
#
# A tier is a capability hint, not a model name. Calling code asks for "small", "mid",
# or "frontier" and never names a vendor. This file is the only place vendors appear.
#
# Swapping the model an agent runs on is a change to this file. It is not a change to
# any agent's code.

anthropic:
  small:    claude-haiku-4-5
  mid:      claude-sonnet-5
  frontier: claude-opus-5
  default:  claude-sonnet-5

ollama:
  small:    qwen2.5:3b
  mid:      qwen2.5:14b
  frontier: qwen2.5:32b
  default:  qwen2.5:14b

# Google, via GEMINI_API_KEY. No stable 3.x pro exists yet and gemini-2.5-pro is closed
# to new keys, so frontier names a preview -- the honest state of the shelf, not a
# preference for preview models.
gemini:
  small:    gemini-3.5-flash-lite
  mid:      gemini-3.7-flash
  frontier: gemini-3.1-pro-preview
  default:  gemini-3.7-flash

# Any server speaking the OpenAI chat-completions protocol: vLLM, Together, Groq,
# OpenRouter, LM Studio. Set OPENAI_COMPATIBLE_BASE_URL and OPENAI_COMPATIBLE_API_KEY,
# then edit the model names below to whatever that server actually hosts.
openai_compatible:
  # 3.1-8B rather than the smaller 3.2-3B: the Hugging Face router answers
  # model_not_supported for 3B, and a tier that names a model nobody serves is a
  # 400 at the first call rather than a fallback.
  small:    meta-llama/Llama-3.1-8B-Instruct
  mid:      meta-llama/Llama-3.3-70B-Instruct
  frontier: deepseek-ai/DeepSeek-V3
  default:  meta-llama/Llama-3.3-70B-Instruct

# Embedding models, reached through shared/embeddings.py rather than shared/llm.py.
# An embedding is not a completion: it returns coordinates, not text, so it does not fit
# the one function llm_call exposes and gets its own entry point rather than a second
# parameter on that one.
#
# The tiers here mean dimensions and quality, the same way they mean capability above.
huggingface_embeddings:
  small:    sentence-transformers/all-MiniLM-L6-v2
  mid:      sentence-transformers/all-mpnet-base-v2
  frontier: BAAI/bge-large-en-v1.5
  default:  sentence-transformers/all-MiniLM-L6-v2
