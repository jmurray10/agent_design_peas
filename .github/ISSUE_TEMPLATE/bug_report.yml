name: Bug report
description: Something errored, hung, or behaved wrongly, and it is not about a claim in a README.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If a documented claim did not reproduce, use the other template instead.
        This one is for a script that crashed, a container that would not start,
        or a setup step that does not work as written.
  - type: input
    id: what
    attributes:
      label: What you ran
      placeholder: "docker compose run --rm verify"
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: What happened
      description: The error, the traceback, or what it did instead.
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and OS, or the container
      placeholder: "3.11 on macOS 15, or: peas image built today"
    validations:
      required: true
  - type: checkboxes
    id: zero-setup
    attributes:
      label: Which half
      options:
        - label: This was a `before.py`, which is supposed to need nothing but Python 3.10+
        - label: This was an `after.py` or an agent, which reaches a model or a recording
